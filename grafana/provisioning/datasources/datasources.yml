apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: PostgreSQL
    type: postgres
    uid: postgres
    url: postgres:5432
    database: mlservice
    user: postgres
    jsonData:
      sslmode: disable
      postgresVersion: 1500
      timescaledb: false
    secureJsonData:
      password: postgres
    isDefault: false
    editable: false
